services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callbooking
      POSTGRES_PASSWORD: callbooking
      POSTGRES_DB: callbooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callbooking"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://callbooking:callbooking@postgres:5432/callbooking?sslmode=disable"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      LOG_LEVEL: "info"
      SHUTDOWN_TIMEOUT: "5s"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
